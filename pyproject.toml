[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pftree"
dynamic = ["version"]
description = "A dictionary representation of a filesystem tree, with per-directory read / analyze / write processing"
readme = "README.rst"
license = { text = "MIT" }
authors = [{ name = "FNNDSC", email = "dev@babyMRI.org" }]
requires-python = ">=3.11"
dependencies = ["tqdm>=4.60"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/FNNDSC/pftree"

[project.scripts]
pftree = "pftree.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["pftree"]

[tool.setuptools.dynamic]
version = { attr = "pftree.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
